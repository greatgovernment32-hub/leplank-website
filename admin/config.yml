              - {label: Photo, name: image, widget: image, choose_url: false}
              - {label: Caption, name: caption, widget: string}
      - label: "Bathrooms"
        name: "bathrooms"
        file: "content/bathrooms.json"
        fields:
          - {label: Page Title, name: title, widget: string}
          - label: Projects
            name: projects
            widget: list
            summary: "{{fields.caption}}"
            fields:
              - {label: Photo, name: image, widget: image, choose_url: false}
              - {label: Caption, name: caption, widget: string}
      - label: "Offices & Studies"
        name: "offices"
        file: "content/offices.json"
        fields:
          - {label: Page Title, name: title, widget: string}
          - label: Projects
            name: projects
            widget: list
            summary: "{{fields.caption}}"
            fields:
              - {label: Photo, name: image, widget: image, choose_url: false}
              - {label: Caption, name: caption, widget: string}
